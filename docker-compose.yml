name: edge-gateway-demo

# Two gateways share one SQLite database on the shared volume.  The session
# binding, closed state and can-offline verdict therefore agree across both
# gateways.  GATEWAY_ID must be distinct per gateway so each instance clears
# only its own interrupted in-flight rows on restart.
services:
  upstream-a:
    build: ./upstream
    environment:
      UPSTREAM_NAME: alpha
      DEFAULT_DELAY_MS: "3000"   # 默认响应延迟，可被请求参数 delay_ms 覆盖
    ports:
      - "9001:8000"

  upstream-b:
    build: ./upstream
    environment:
      UPSTREAM_NAME: beta
      DEFAULT_DELAY_MS: "500"
    ports:
      - "9002:8000"

  gateway-a:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-a
      GATEWAY_DB: /data/gateway.db
      UPSTREAMS: "alpha=http://upstream-a:8000;beta=http://upstream-b:8000"
      INITIAL_TARGET: alpha
    ports:
      - "8080:8000"
    volumes:
      - gateway-data:/data
    depends_on:
      - upstream-a
      - upstream-b

  gateway-b:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-b
      GATEWAY_DB: /data/gateway.db
      UPSTREAMS: "alpha=http://upstream-a:8000;beta=http://upstream-b:8000"
      INITIAL_TARGET: alpha
    ports:
      - "8081:8000"
    volumes:
      - gateway-data:/data
    depends_on:
      - upstream-a
      - upstream-b

volumes:
  gateway-data:
